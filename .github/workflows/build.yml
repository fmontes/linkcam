name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: make test

      - name: Build menu-bar app
        run: make app

      - name: Verify universal binaries
        run: |
          for b in bin/linkcam-cli bin/uvc-util bin/xu-probe dist/LinkCam.app/Contents/MacOS/LinkCam; do
            echo "== $b =="
            file "$b"
            lipo -archs "$b"
            # both slices must be present
            lipo -archs "$b" | grep -q arm64
            lipo -archs "$b" | grep -q x86_64
          done

      - name: Validate app metadata
        run: |
          plutil -lint app/Info.plist
          plutil -lint app/LinkCam.entitlements
          plutil -lint dist/LinkCam.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/LinkCam.app

      - name: Smoke-test the CLI without a camera
        run: |
          out="$(./linkcam status --json 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q '"connected"' || {
            echo "unexpected output from linkcam"; exit 1; }
